name: Executar Robos KMM e Atualizar Google Sheets

on:
  schedule:
    # Roda a cada 3 horas automaticamente
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite acionar manualmente no GitHub

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl requests beautifulsoup4 lxml
          playwright install --with-deps chromium

      - name: Executar Robô 1 - Relatório de Manutenção
        env:
          KMM_USER: ${{ secrets.KMM_USER }}
          KMM_PASS: ${{ secrets.KMM_PASS }}
        run: python acesso_kmm.py

      - name: Pausa de 15s para deslogar e liberar o KMM
        run: sleep 15

      - name: Executar Robô 2 - Manutenção Externa
        env:
          KMM_USER: ${{ secrets.KMM_USER }}
          KMM_PASS: ${{ secrets.KMM_PASS }}
        run: python acesso_kmm_externa.py
